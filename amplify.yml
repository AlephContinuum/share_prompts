version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Same Node.js major version as local development
        - nvm install 22 && nvm use 22
        - node --version
        - npm ci
    build:
      commands:
        # Amplify only exposes environment variables at build time.
        # Write the ones the server needs into .env.production so the
        # Next.js server (SSR + API routes) can read them at runtime.
        - env | grep -E '^(MONGODB_URI|GOOGLE_ID|GOOGLE_CLIENT_SECRET|NEXTAUTH_URL|NEXTAUTH_SECRET|BEDROCK_|GEMINI_|OPENAI_|DEEPSEEK_|GROQ_|NVIDIA_|VERDA_|JUDGE_MODEL|UTILITY_MODEL)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
